name: Update Air Quality Data

on:
  schedule:
    - cron: '20 16,23 * * *'
  workflow_dispatch:

concurrency:
  group: update-air-quality   # Unique per workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-aq:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air-quality   

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            EvalstacE/EpivalE
            any::arcgislayers

      - name: Download existing archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download air-quality-latest --pattern "*.rds" --dir data --clobber \
            || echo "No existing air-quality-latest release; starting bootstrap."

      - name: Run DEQ update script
        run: Rscript scripts/update_aq_data.R

      - name: Publish updated RDS files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view air-quality-latest >/dev/null 2>&1; then
            gh release create air-quality-latest \
              --title "Air Quality Data (Latest)" \
              --notes "Automated hourly PM2.5 datasets for Helena Rossiter Pump House (RP)."
          fi
          gh release upload air-quality-latest data/aq_daily.rds data/aq_hourly.rds --clobber